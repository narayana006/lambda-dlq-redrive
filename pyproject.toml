[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lambda-dlq-redrive"
version = "0.1.0"
description = "Inspect, filter and safely replay messages from SQS dead-letter queues used with AWS Lambda."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
dev = ["pytest>=7", "moto[sqs]>=5"]

[project.scripts]
lambda-dlq-redrive = "lambda_dlq_redrive.cli:main"

[tool.setuptools]
packages = ["lambda_dlq_redrive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
